schema_version: 1
name: broadband-dataset-v1
description: >
  Multi-seed mixed broadband dataset across interactive, gaming, streaming, and bulk
  traffic classes, all 7 devices, varied modem rates, and concurrent laptop mixed traffic.
idle_timeout_s: 5.0
port_range:
  min_port: 30000
  max_port: 59999

configs:
  - config_id: cfg-01-home-mix-100m
    seed: 101001
    description: 100 Mbps home baseline with regular calls, bursty gaming, 3 TVs, upload bulk, and mixed laptop
    modem_rate: 100mbit
    capture_duration_s: 42.0
    streams:
      - id: call-1
        device_id: call
        label: interactive
        kind: udp_dataset
        rate: 50
        duration_s: 1.8
        sessions: 25
        rounds: 10
        pattern: regular
        min_payload_bytes: 140
        max_payload_bytes: 180
      - id: laptop-call
        device_id: laptop
        label: interactive
        kind: udp_dataset
        rate: 35
        duration_s: 1.8
        sessions: 20
        rounds: 9
        pattern: regular
        min_payload_bytes: 100
        max_payload_bytes: 160
      - id: game-1
        device_id: game
        label: gaming
        kind: udp_dataset
        rate: 60
        duration_s: 1.8
        sessions: 25
        rounds: 10
        pattern: bursty
        burst_size: 4
        intra_burst_gap_ms: 2.0
        min_payload_bytes: 64
        max_payload_bytes: 180
      - id: laptop-game
        device_id: laptop
        label: gaming
        kind: udp_dataset
        rate: 45
        duration_s: 1.8
        sessions: 20
        rounds: 9
        pattern: bursty
        burst_size: 3
        intra_burst_gap_ms: 3.0
        min_payload_bytes: 56
        max_payload_bytes: 150
      - id: tv1-stream
        device_id: tv1
        label: streaming
        kind: http_chunks
        duration_s: 28.0
        min_chunk_bytes: 120000
        max_chunk_bytes: 320000
        min_interval_s: 0.20
        max_interval_s: 0.36
      - id: tv2-stream
        device_id: tv2
        label: streaming
        kind: http_chunks
        duration_s: 28.0
        min_chunk_bytes: 150000
        max_chunk_bytes: 400000
        min_interval_s: 0.22
        max_interval_s: 0.40
      - id: tv3-stream
        device_id: tv3
        label: streaming
        kind: http_chunks
        duration_s: 28.0
        min_chunk_bytes: 100000
        max_chunk_bytes: 280000
        min_interval_s: 0.18
        max_interval_s: 0.34
      - id: laptop-stream
        device_id: laptop
        label: streaming
        kind: http_chunks
        duration_s: 28.0
        min_chunk_bytes: 90000
        max_chunk_bytes: 240000
        min_interval_s: 0.20
        max_interval_s: 0.35
      - id: bulk-up
        device_id: bulk
        label: bulk
        kind: iperf3_tcp
        direction: upload
        streams: 8
        rounds: 22
        round_duration_s: 1
        bitrate: 6M
        gap_s: 0.05
      - id: laptop-down
        device_id: laptop
        label: bulk
        kind: iperf3_tcp
